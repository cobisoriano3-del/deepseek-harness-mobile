name: Build Android APK

on:
  push:
    branches:
      - build/android-apk

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: dsh-mobile/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        working-directory: dsh-mobile
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-mobile-1.0.42-release
          path: dsh-mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
