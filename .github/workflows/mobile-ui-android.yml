name: Mobile UI and Android APK

on:
  pull_request:
    paths:
      - "dsh-mobile/**"
      - ".github/workflows/mobile-ui-android.yml"
  push:
    branches:
      - master
      - "fix/mobile-drawer-overlay-ui"
    paths:
      - "dsh-mobile/**"
      - ".github/workflows/mobile-ui-android.yml"

permissions:
  contents: read

concurrency:
  group: mobile-ui-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-ui:
    name: Mobile WebView UI regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
      - name: Install web test dependencies
        run: pnpm install --frozen-lockfile --filter @deepseek-ai/dsh-web-frontend...
      - name: Install Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium
      - name: Run mobile UI regression gate
        run: node dsh-mobile/tools/verify-mobile-ui.mjs

  android-apk:
    name: Build signed Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build release APK
        working-directory: dsh-mobile
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: Validate APK archive
        run: |
          APK="dsh-mobile/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-drawer-fix
          path: dsh-mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
