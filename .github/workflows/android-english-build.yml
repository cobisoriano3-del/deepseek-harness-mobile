name: Android English Build

on:
  push:
    branches:
      - feature/english-language
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Check injected JavaScript
        run: |
          node --check dsh-mobile/app/src/main/assets/early-polyfill.js
          node --check dsh-mobile/app/src/main/assets/inject.js
      - name: Build release APK
        working-directory: dsh-mobile
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-1.0.42-english
          path: dsh-mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
