name: Android English Build

on:
  push:
    branches:
      - feature/english-language
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Check injected JavaScript
        run: |
          node --check dsh-mobile/app/src/main/assets/early-polyfill.js
          node --check dsh-mobile/app/src/main/assets/inject.js
      - name: Build release APK
        working-directory: dsh-mobile
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-1.0.42-english
          path: dsh-mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
